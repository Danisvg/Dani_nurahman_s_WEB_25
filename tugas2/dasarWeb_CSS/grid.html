<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-style:arial;
            color: white;
            text-transform: uppercase;
            text-align: center;
        }
        .container{
            width: 600px;
            margin:50px auto;
            border: 5px solid #333;
            box-sizing: border-box;
            padding: 5px;
            display:grid;
            grid-template-columns: 1fr 1.5fr;
            grid-template-areas: 
                "header header"
                "aside aside"
                "nav main"
                "footer main";
            grid-template-rows: 1fr 1fr 1.3fr;
        }
        header{
            grid-area:header;
            background-color: #b063d8;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        aside{
            grid-area:aside;
            background-color: #d86363;
            padding: 60px 0;
        }
        nav{
            grid-area:nav;
            background-color: #63d8b0;
            padding: 100px 0;
        }
        main{
            grid-area:main;
            background-color: #63a1d8;
            box-sizing: border-box;
            flex: 1.5;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        footer{
            grid-area:footer;
            background-color: #d8b063;
            padding: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>Header</header>
        <aside>Aside</aside>
        <nav>Nav</nav>
        <main>Main</main>
        <footer>Footer</footer>
    </div>
</body>
</html>
